name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

  typescript-mcp-sdk2:
    name: TypeScript MCP SDK 2 (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json

      - name: Install frozen dependencies
        run: npm ci

      - name: Run direct and stdio SDK 2 smokes
        run: npm run smoke

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Reject MCP SDK 1 and FastMCP runtime paths
        if: matrix.node-version == '24'
        working-directory: .
        run: |
          if rg -n '@modelcontextprotocol/sdk' \
            packages/mcp-server/package.json \
            packages/mcp-server/package-lock.json \
            packages/mcp-server/src \
            packages/mcp-server/scripts; then
            echo 'MCP TypeScript SDK 1 runtime path detected' >&2
            exit 1
          fi
          if rg -n 'mcp\.server\.fastmcp|from fastmcp|import fastmcp' \
            mcp-server/pyproject.toml \
            mcp-server/uv.lock \
            mcp-server/src; then
            echo 'FastMCP runtime path detected' >&2
            exit 1
          fi

  python-mcp-sdk2:
    name: Python MCP SDK 2 (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: mcp-server/uv.lock

      - name: Install frozen dependencies
        run: uv sync --frozen --dev --python "${{ matrix.python-version }}"

      - name: Run SDK 2 protocol smokes
        run: uv run --frozen pytest -q

      - name: Build Python package
        run: uv build

      - name: Build standalone stdio image
        if: matrix.python-version == '3.13'
        run: docker build --tag drawio-mcp-server:ci .
